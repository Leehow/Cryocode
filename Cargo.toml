[package]
name = "cryocode"
version = "0.1.0"
edition = "2021"
description = "A fast GPU-native code & document editor"

[[bin]]
name = "cryocode"
path = "src/main.rs"

[dependencies]
ahash = "0.8"
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl", "std"] }
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.33"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing", "html"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
roxmltree = "0.20"
csv = "1"
rfd = "0.16"
dirs = "6"
ignore = "0.4"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
calamine = "0.38"
alacritty_terminal = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev.package."*"]
opt-level = 2
